[package]
name = "rvl-kovrex"
version = "0.1.0"
edition = "2024"
description = "Kovrex agent wrapper for rvl - CMD+RVL's reference implementation"
repository = "https://github.com/cmdrvl/rvl-kovrex"
license = "MIT"

[dependencies]
# Core rvl engine
rvl = { git = "https://github.com/cmdrvl/rvl.git", branch = "main" }

# Server
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "rvl-kovrex"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
